<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eşşek Dönercisi | Mega Market & Restoran</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Playfair+Display:wght@900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- VOIDMARKET MEGA ENGINE V7.0 --- */
        :root {
            --fuchsia: #ff00ff;
            --fuchsia-glow: rgba(255, 0, 255, 0.6);
            --bg-main: #020202;
            --surface: #0a0a0a;
            --border: #151515;
            --text-pure: #ffffff;
            --text-dim: #777777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body { 
            background: var(--bg-main); 
            color: var(--text-pure); 
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--fuchsia), #550055); border-radius: 5px; }

        /* Navigation */
        nav {
            position: fixed;
            top: 0; width: 100%; height: 90px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(25px);
            z-index: 9000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            border-bottom: 1px solid var(--border);
        }

        .brand { font-family: 'Space Grotesk'; font-weight: 700; font-size: 1.6rem; letter-spacing: -1px; }
        .brand span { color: var(--fuchsia); text-shadow: 0 0 15px var(--fuchsia-glow); }

        .market-icon {
            background: var(--fuchsia);
            color: #000;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
        }

        .market-icon:hover { transform: scale(1.1) translateY(-2px); box-shadow: 0 10px 30px var(--fuchsia-glow); }

        /* Hero */
        .hero-section {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a001a 0%, #000 70%);
            border-bottom: 1px solid var(--border);
        }

        .hero-section h1 {
            font-family: 'Playfair Display';
            font-size: 7vw;
            background: linear-gradient(to bottom, #fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Menu Grid */
        .market-container { padding: 80px 5%; }
        .section-header { margin-bottom: 60px; display: flex; align-items: baseline; gap: 20px; }
        .section-header h2 { font-size: 3rem; font-family: 'Space Grotesk'; }
        .section-header .line { flex-grow: 1; height: 1px; background: var(--border); }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .food-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            transition: 0.4s;
            display: flex;
            flex-direction: column;
        }

        .food-card:hover { border-color: var(--fuchsia); transform: translateY(-10px); }

        .food-img {
            width: 100%;
            height: 220px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 20px;
            background: #111;
        }

        .food-info h3 { font-size: 1.3rem; margin-bottom: 8px; font-weight: 700; }
        .food-info p { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; height: 45px; overflow: hidden; }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price { font-size: 1.5rem; font-weight: 800; color: var(--fuchsia); }

        .qty-btn-circle {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: #151515;
            border: 1px solid #222;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .qty-btn-circle:hover { background: var(--fuchsia); color: #000; border-color: var(--fuchsia); }

        /* Sidebar Cart */
        #market-sidebar {
            position: fixed;
            right: -100%;
            top: 0; width: 480px; height: 100%;
            background: #050505;
            z-index: 9500;
            padding: 60px 40px;
            transition: 0.7s cubic-bezier(0.9, 0, 0.1, 1);
            border-left: 1px solid var(--fuchsia);
        }

        #market-sidebar.active { right: 0; }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid #111;
        }

        .item-controls { display: flex; align-items: center; gap: 15px; }
        .count-bubble { font-weight: 800; color: var(--fuchsia); min-width: 25px; text-align: center; }

        /* Checkout Form */
        .checkout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .checkout-box {
            background: var(--surface);
            padding: 50px;
            border-radius: 35px;
            width: 550px;
            border: 1px solid var(--fuchsia);
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 0.8rem; }
        .input-style {
            width: 100%; padding: 18px;
            background: #000; border: 1px solid #222;
            color: #fff; border-radius: 12px;
        }

        .pay-btn {
            width: 100%; padding: 22px;
            background: var(--fuchsia); color: #000;
            font-weight: 900; border: none; border-radius: 15px;
            cursor: pointer; margin-top: 20px;
        }

        /* --- BIG MODERN MAP --- */
        .map-grand-container {
            padding: 100px 5%;
            background: #000;
        }

        .map-title-box { text-align: center; margin-bottom: 40px; }
        .map-title-box h2 { font-size: 3rem; color: var(--fuchsia); text-transform: uppercase; }

        .big-map-frame {
            width: 100%;
            height: 700px;
            border-radius: 50px;
            overflow: hidden;
            border: 2px solid var(--fuchsia);
            box-shadow: 0 0 60px rgba(255,0,255,0.2);
            position: relative;
        }

        /* Harita Filtreleme ve Stil Paneli */
        .map-overlay-style {
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: 50px;
            box-shadow: inset 0 0 100px #000;
        }

        footer { padding: 80px; text-align: center; opacity: 0.2; letter-spacing: 10px; font-size: 0.7rem; }
    </style>
</head>
<body>

    <nav>
        <div class="brand">EŞŞEK <span>DÖNERCİSİ</span></div>
        <button class="market-icon" onclick="toggleMarket()">
            🛒 <span id="master-count">0</span> ÜRÜN
        </button>
    </nav>

    <section class="hero-section">
        <h1>MEGA<br>MENU</h1>
    </section>

    <section class="market-container">
        <div class="section-header">
            <h2>MARKET</h2>
            <div class="line"></div>
            <p style="color:var(--fuchsia)">SEPETSİZ DEĞİLİZ.</p>
        </div>
        
        <div class="food-grid" id="main-grid">
            </div>
    </section>

    <div id="market-sidebar">
        <div style="display:flex; justify-content:space-between; margin-bottom:50px;">
            <h2 style="font-size:2.5rem;">Sepet</h2>
            <button onclick="toggleMarket()" style="background:none; border:none; color:#fff; font-size:2rem; cursor:pointer;">✕</button>
        </div>
        
        <div id="cart-items-flow" style="max-height:60%; overflow-y:auto;">
            </div>

        <div style="margin-top:40px; border-top:1px solid #222; padding-top:30px;">
            <div style="display:flex; justify-content:space-between; font-size:2rem; font-weight:900;">
                <span>TOPLAM:</span>
                <span id="final-price">$0.00</span>
            </div>
            <button class="pay-btn" onclick="openPayment()">ÖDEME ADIMINA GEÇ</button>
        </div>
    </div>

    <div class="checkout-overlay" id="checkout-modal">
        <div class="checkout-box">
            <h2 style="margin-bottom:30px;">Teslimat Bilgileri</h2>
            <form action="https://formspree.io/f/mkovwdyw" method="POST">
                <input type="hidden" name="_subject" value="YENİ MARKET SİPARİŞİ!">
                <input type="hidden" name="Siparis" id="form-items">
                <input type="hidden" name="Tutar" id="form-total">

                <div class="input-group">
                    <label>TAM ADINIZ</label>
                    <input type="text" name="name" class="input-style" required>
                </div>
                <div class="input-group">
                    <label>TELEFON</label>
                    <input type="tel" name="phone" class="input-style" required>
                </div>
                <div class="input-group">
                    <label>ADRES</label>
                    <textarea name="address" class="input-style" style="height:100px" required></textarea>
                </div>
                <button type="submit" class="pay-btn">SİPARİŞİ ONAYLA</button>
                <center><p onclick="closePayment()" style="margin-top:20px; cursor:pointer; opacity:0.5;">Kapat</p></center>
            </form>
        </div>
    </div>

    <section class="map-grand-container">
        <div class="map-title-box">
            <h2>KARTAL / ESENTEPE</h2>
            <p>Hürriyet Mahallesi, Şeyh Şamil Ortaokulu Yanı</p>
        </div>
        <div class="big-map-frame">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3015.011!2d29.2268!3d40.9089!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14cad73d8e5d6305%3A0x20307f5453a698c3!2zRMWfZWsgZMO2bmVyY2lzaQ!5e0!3m2!1str!2str!4v1700000000000!5m2!1str!2str" 
                width="100%" height="100%" 
                style="border:0; filter: invert(90%) hue-rotate(240deg) brightness(0.8) contrast(1.2);" 
                allowfullscreen="" loading="lazy">
            </iframe>
            <div class="map-overlay-style"></div>
        </div>
    </section>

    <footer>VOIDMARKET DIGITAL INFRASTRUCTURE v7.2</footer>

    <script>
        const products = [
            { id: 1, name: "Klasik Döner", price: 15, desc: "Sütle dinlendirilmiş yaprak et.", img: "https://images.unsplash.com/photo-1633321088355-d0f81134ca3b?auto=format&fit=crop&w=600" },
            { id: 2, name: "Ballı Pankek", price: 12, desc: "Taze meyveler ve organik bal.", img: "https://images.unsplash.com/photo-1567620905732-2d1ec7bb7445?auto=format&fit=crop&w=600" },
            { id: 3, name: "Double Burger", price: 22, desc: "200gr köfte, karamelize soğan.", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600" },
            { id: 4, name: "Tavuk Wrap", price: 10, desc: "Lavaş arası çıtır tavuk parçaları.", img: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=600" },
            { id: 5, name: "Özel İskender", price: 28, desc: "Bolu tereyağı ile servis edilir.", img: "https://images.unsplash.com/photo-1644704570044-d30906803763?auto=format&fit=crop&w=600" },
            { id: 6, name: "Füme Kaburga", price: 45, desc: "12 saat tütsülenmiş dana kaburga.", img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600" },
            { id: 7, name: "Truffle Fries", price: 8, desc: "Trüf yağı ve parmesanlı patates.", img: "https://images.unsplash.com/photo-1573082891335-961f38e24479?auto=format&fit=crop&w=600" },
            { id: 8, name: "Meksika Takosu", price: 18, desc: "Acı soslu kıyma ve mısır tortillası.", img: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=600" },
            { id: 9, name: "Somon Bowl", price: 32, desc: "Kinoa, avokado ve fırın somon.", img: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=600" },
            { id: 10, name: "Kuzu Şiş", price: 38, desc: "Marine edilmiş kuzu but parçaları.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600" },
            { id: 11, name: "Falafel Tabak", price: 14, desc: "Humus ve tahin soslu vegan seçim.", img: "https://images.unsplash.com/photo-1547000558-a833075d9e5a?auto=format&fit=crop&w=600" },
            { id: 12, name: "Cheesecake", price: 9, desc: "San Sebastian usulü yanık pasta.", img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=600" },
            { id: 13, name: "Sıcak Brownie", price: 11, desc: "Erimiş çikolata ve dondurma.", img: "https://images.unsplash.com/photo-1564921922310-fe5583745e56?auto=format&fit=crop&w=600" },
            { id: 14, name: "Limonata", price: 6, desc: "Ev yapımı nane ferahlığı.", img: "https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&w=600" },
            { id: 15, name: "Türk Kahvesi", price: 5, desc: "Double közde pişirilmiş.", img: "https://images.unsplash.com/photo-1559496417-e7f25cb247f3?auto=format&fit=crop&w=600" },
            { id: 16, name: "Buzlu Latte", price: 7, desc: "Ethiopia çekirdeklerinden.", img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=600" }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = products.map(p => `
                <div class="food-card">
                    <img src="${p.img}" class="food-img" alt="${p.name}">
                    <div class="food-info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                        <div class="card-footer">
                            <span class="price">$${p.price}</span>
                            <button class="qty-btn-circle" onclick="addToCart(${p.id})">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(x => x.id === id);
            const exists = cart.find(x => x.id === id);
            if(exists) exists.count++;
            else cart.push({...product, count: 1});
            updateUI();
        }

        function changeCount(id, amt) {
            const item = cart.find(x => x.id === id);
            item.count += amt;
            if(item.count <= 0) cart = cart.filter(x => x.id !== id);
            updateUI();
        }

        function updateUI() {
            const flow = document.getElementById('cart-items-flow');
            let total = 0;
            let itemsText = "";
            
            flow.innerHTML = cart.map(item => {
                total += item.price * item.count;
                itemsText += `${item.name} (${item.count} Adet), `;
                return `
                    <div class="cart-item-row">
                        <div>
                            <div style="font-weight:700">${item.name}</div>
                            <div style="font-size:0.8rem; color:var(--fuchsia)">$${item.price * item.count}</div>
                        </div>
                        <div class="item-controls">
                            <span class="qty-btn-circle" style="width:30px; height:30px; font-size:1rem" onclick="changeCount(${item.id}, -1)">-</span>
                            <span class="count-bubble">${item.count}</span>
                            <span class="qty-btn-circle" style="width:30px; height:30px; font-size:1rem" onclick="changeCount(${item.id}, 1)">+</span>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('master-count').innerText = cart.reduce((a,b) => a + b.count, 0);
            document.getElementById('final-price').innerText = "$" + total;
            document.getElementById('form-items').value = itemsText;
            document.getElementById('form-total').value = "$" + total;
        }

        function toggleMarket() { document.getElementById('market-sidebar').classList.toggle('active'); }
        function openPayment() { if(cart.length > 0) document.getElementById('checkout-modal').style.display = 'flex'; }
        function closePayment() { document.getElementById('checkout-modal').style.display = 'none'; }

        renderProducts();
    </script>

</body>
</html>
