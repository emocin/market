<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eşşek Dönercisi | Premium Market Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* --- GÖRSELDEKİ TASARIMIN CSS KARŞILIĞI --- */
        :root {
            --primary-gold: #e2ae3d;
            --dark-surface: #121212;
            --card-bg: #1e1e1e;
            --bg-body: #f5f5f5; /* Görseldeki gibi açık gri dış plan */
            --text-dark: #1a1a1a;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg-body); 
            color: var(--text-dark); 
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
        }

        /* Navigasyon */
        nav {
            background: var(--dark-surface);
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-family: 'Playfair Display'; font-size: 1.8rem; color: var(--primary-gold); }

        .cart-trigger-btn {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Hero Section */
        .hero-container {
            max-width: 1200px;
            margin: 40px auto;
            background: white;
            padding: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .hero-text h1 { font-family: 'Playfair Display'; font-size: 4rem; margin-bottom: 10px; line-height: 1; }
        .hero-text p { color: #666; font-size: 1.1rem; }

        .hero-img img {
            width: 450px;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        /* Grid Sistemi */
        .market-section { max-width: 1200px; margin: 0 auto 100px; }
        
        .grid-title {
            border-left: 8px solid var(--primary-gold);
            padding-left: 20px;
            margin-bottom: 40px;
            font-size: 2rem;
            text-transform: uppercase;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        /* Kart Tasarımı (Görselle Aynı Stil) */
        .product-card {
            background: var(--dark-surface);
            border-radius: 20px;
            padding: 10px;
            transition: 0.4s;
            color: white;
            border: 2px solid transparent;
        }

        .product-card:hover { border-color: var(--primary-gold); transform: translateY(-10px); }

        .p-img-box {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .p-img-box img { width: 100%; height: 100%; object-fit: cover; }

        .p-content { padding: 10px; background: white; border-radius: 15px; color: #000; }
        .p-content h3 { font-size: 1.1rem; margin-bottom: 5px; height: 30px; overflow: hidden; }
        .p-content p { font-size: 0.8rem; color: #777; margin-bottom: 15px; height: 35px; }

        .p-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .p-price { font-size: 1.4rem; font-weight: 900; color: #000; }

        .p-btn {
            background: #222;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Sidebar Cart (Görseldeki gibi koyu sağ panel) */
        #sidebar-cart {
            position: fixed;
            right: -100%; top: 0;
            width: 400px; height: 100%;
            background: var(--dark-surface);
            color: white;
            z-index: 2000;
            padding: 40px;
            transition: 0.5s;
            box-shadow: -10px 0 50px rgba(0,0,0,0.5);
        }

        #sidebar-cart.active { right: 0; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        /* Form Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .modal-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 500px;
        }

        .form-input {
            width: 100%; padding: 12px;
            margin: 10px 0; border: 1px solid #ddd; border-radius: 10px;
        }

        /* Renkli Harita */
        .map-section { padding: 60px 8%; background: white; }
        .map-frame {
            width: 100%;
            height: 500px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">EŞŞEK DÖNERCİSİ</div>
        <button class="cart-trigger-btn" onclick="toggleCart()">CART ($<span id="cart-total-nav">0</span>)</button>
    </nav>

    <div class="hero-container">
        <div class="hero-text">
            <h1>PREMIUM<br>DÖNER & BURGER</h1>
            <p>Esentepe'nin en havalı market sistemi. Kalite asla tesadüf değildir.</p>
        </div>
        <div class="hero-img">
            <img src="https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?q=80&w=600&auto=format&fit=crop" alt="Main Burger">
        </div>
    </div>

    <section class="market-section">
        <h2 class="grid-title">GÜNCEL MARKET MENÜSÜ</h2>
        <div class="product-grid" id="product-list">
            </div>
    </section>

    <div id="sidebar-cart">
        <h2 style="margin-bottom:30px; border-bottom:2px solid var(--primary-gold); padding-bottom:10px;">SEPETİNİZ</h2>
        <div id="cart-items" style="max-height: 60vh; overflow-y: auto;"></div>
        <div style="margin-top:30px;">
            <div style="display:flex; justify-content:space-between; font-size:1.8rem; font-weight:900;">
                <span>TOPLAM:</span>
                <span id="final-total">$0</span>
            </div>
            <button class="cart-trigger-btn" style="width:100%; padding:20px; margin-top:20px;" onclick="openCheckout()">SİPARİŞ VER</button>
            <p onclick="toggleCart()" style="text-align:center; margin-top:15px; cursor:pointer; opacity:0.6;">Kapat</p>
        </div>
    </div>

    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-box">
            <h2>SİPARİŞİ TAMAMLA</h2>
            <form action="https://formspree.io/f/mkovwdyw" method="POST">
                <input type="hidden" name="Siparis" id="hidden-cart">
                <input type="hidden" name="Tutar" id="hidden-total">
                <input type="text" name="name" class="form-input" placeholder="Ad Soyad" required>
                <input type="tel" name="phone" class="form-input" placeholder="Telefon" required>
                <textarea name="address" class="form-input" placeholder="Açık Adres" style="height:100px" required></textarea>
                <button type="submit" class="cart-trigger-btn" style="width:100%; padding:15px;">ONAYLA</button>
                <p onclick="closeCheckout()" style="text-align:center; margin-top:15px; cursor:pointer;">Vazgeç</p>
            </form>
        </div>
    </div>

    <section class="map-section">
        <div class="map-frame">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d30000000!2d-150!3d0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1str!2str!4v17000000000005" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </section>

    <script>
        // 12 Çeşit Kararlı Fotoğraflı Ürün Listesi ($15 - $100)
        const products = [
            { id: 1, name: "Unutturan Mega Dürüm", price: 18, desc: "Efsanevi sos ve yaprak et.", img: "https://images.unsplash.com/photo-1662116765994-1e039436441b?w=500&q=80" },
            { id: 2, name: "Premium Gold Burger", price: 35, desc: "Wagyu köftesi ve cheddar.", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80" },
            { id: 3, name: "Sultan İskender", price: 45, desc: "Özel tereyağlı şaheser.", img: "https://images.unsplash.com/photo-1644704570044-d30906803763?w=500&q=80" },
            { id: 4, name: "Truffle Special Burger", price: 55, desc: "Trüf mantarlı gurme seçim.", img: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=500&q=80" },
            { id: 5, name: "Double Etli Pizza", price: 28, desc: "Bol malzemeli çıtır hamur.", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=80" },
            { id: 6, name: "Şefin Tabağı (Mix)", price: 75, desc: "Tüm lezzetlerin birleşimi.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&q=80" },
            { id: 7, name: "Acılı Meksika Burger", price: 32, desc: "Jalapeno ve özel acı sos.", img: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=500&q=80" },
            { id: 8, name: "Wagyu Steak Plate", price: 100, desc: "A5 Kalite Wagyu dilimleri.", img: "https://images.unsplash.com/photo-1546241072-48010ad28c2c?w=500&q=80" },
            { id: 9, name: "Ballı Pankek Tower", price: 22, desc: "Taze meyveli tatlı son.", img: "https://images.unsplash.com/photo-1567620905732-2d1ec7bb7445?w=500&q=80" },
            { id: 10, name: "Deniz Mahsüllü Pasta", price: 48, desc: "Taze kalamar ve karidesli.", img: "https://images.unsplash.com/photo-1563379091339-03b21bc4a4f8?w=500&q=80" },
            { id: 11, name: "Vip Döner Box", price: 25, desc: "Atıştırmalık pratik lezzet.", img: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=500&q=80" },
            { id: 12, name: "Çıtır Tavuk Kovası", price: 38, desc: "12 parça özel baharatlı.", img: "https://images.unsplash.com/photo-1562967914-6cbb241c2ad3?w=500&q=80" }
        ];

        let cart = [];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="p-img-box"><img src="${p.img}" alt="${p.name}"></div>
                    <div class="p-content">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                        <div class="p-footer">
                            <span class="p-price">$${p.price}</span>
                            <button class="p-btn" onclick="addToCart(${p.id})">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            const inCart = cart.find(x => x.id === id);
            if(inCart) inCart.qty++; else cart.push({...p, qty: 1});
            updateUI();
            if(!document.getElementById('sidebar-cart').classList.contains('active')) toggleCart();
        }

        function changeQty(id, delta) {
            const item = cart.find(x => x.id === id);
            item.qty += delta;
            if(item.qty <= 0) cart = cart.filter(x => x.id !== id);
            updateUI();
        }

        function updateUI() {
            const container = document.getElementById('cart-items');
            let total = 0;
            let cartText = "";

            container.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                cartText += `${item.name} (x${item.qty}), `;
                return `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight:700">${item.name}</div>
                            <div style="color:var(--primary-gold)">$${item.price * item.qty}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <button class="p-btn" style="width:25px; height:25px;" onclick="changeQty(${item.id},-1)">-</button>
                            <span>${item.qty}</span>
                            <button class="p-btn" style="width:25px; height:25px;" onclick="changeQty(${item.id},1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('final-total').innerText = "$" + total;
            document.getElementById('cart-total-nav').innerText = total;
            document.getElementById('hidden-cart').value = cartText;
            document.getElementById('hidden-total').value = "$" + total;
        }

        function toggleCart() { document.getElementById('sidebar-cart').classList.toggle('active'); }
        function openCheckout() { if(cart.length > 0) document.getElementById('checkout-modal').style.display = 'flex'; }
        function closeCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }

        renderProducts();
    </script>
</body>
</html>
