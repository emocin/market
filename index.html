<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eşşek Dönercisi | Mega Market Sistemi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE SYSTEM --- */
        :root {
            --primary-color: #ffcc00; /* Gold/Döner Tonu */
            --accent-color: #e74c3c; /* İştah Açıcı Kırmızı */
            --dark-bg: #0c0c0c;
            --card-bg: #1a1a1a;
            --text-light: #f4f4f4;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }

        /* Navigation */
        nav {
            position: fixed;
            top: 0; width: 100%; height: 90px;
            background: rgba(12, 12, 12, 0.95);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            border-bottom: 2px solid #222;
        }

        .brand-logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--primary-color); }
        
        .market-cart-btn {
            background: var(--primary-color);
            color: #000;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            transition: var(--transition);
        }

        .market-cart-btn:hover { transform: scale(1.05); background: #fff; }

        /* Hero */
        .hero {
            height: 50vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1974&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 { font-family: 'Playfair Display', serif; font-size: 4rem; margin-bottom: 10px; }
        .hero p { font-size: 1.2rem; opacity: 0.8; letter-spacing: 2px; }

        /* Market Section */
        .container { padding: 80px 5%; max-width: 1400px; margin: 0 auto; }
        
        .grid-header { margin-bottom: 50px; border-left: 6px solid var(--primary-color); padding-left: 20px; }
        .grid-header h2 { font-size: 2.5rem; text-transform: uppercase; }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
        }

        .item-card:hover { transform: translateY(-10px); border-color: var(--primary-color); }

        .item-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #222;
        }

        .item-body { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .item-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; }
        .item-desc { font-size: 0.85rem; color: #999; margin-bottom: 20px; height: 40px; }

        .item-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-price { font-size: 1.6rem; font-weight: 900; color: var(--primary-color); }
        
        .add-to-cart {
            width: 45px; height: 45px;
            background: #333;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-to-cart:hover { background: var(--primary-color); color: #000; }

        /* Sidebar Cart Panel */
        .sidebar-cart {
            position: fixed;
            right: -100%; top: 0;
            width: 450px; height: 100%;
            background: #111;
            z-index: 10000;
            padding: 40px;
            box-shadow: -10px 0 50px rgba(0,0,0,0.9);
            transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-cart.active { right: 0; }

        .cart-title { font-size: 2rem; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 20px; }

        .cart-items-list { flex-grow: 1; overflow-y: auto; }

        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .qty-box { display: flex; align-items: center; gap: 10px; background: #000; padding: 5px 12px; border-radius: 8px; }
        .qty-btn { cursor: pointer; color: var(--primary-color); font-weight: 900; }

        .cart-total-box { margin-top: 30px; padding-top: 20px; border-top: 2px solid var(--primary-color); }
        
        .checkout-btn {
            width: 100%;
            padding: 20px;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Order Modal */
        .order-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10001;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 30px;
            width: 500px;
            border: 1px solid #333;
        }

        .form-control {
            width: 100%; padding: 15px;
            background: #000; border: 1px solid #333;
            color: #fff; margin-bottom: 15px; border-radius: 10px;
            font-family: inherit;
        }

        /* BIG COLORFUL MAP */
        .map-section { padding: 80px 5%; background: #000; }
        .map-wrapper {
            width: 100%;
            height: 650px;
            border-radius: 40px;
            overflow: hidden;
            border: 4px solid #1a1a1a;
            position: relative;
        }

        footer { text-align: center; padding: 50px; opacity: 0.3; font-size: 0.7rem; letter-spacing: 5px; }

    </style>
</head>
<body>

    <nav>
        <div class="brand-logo">EŞŞEK <span>DÖNERCİSİ</span></div>
        <button class="market-cart-btn" onclick="toggleCart()">
            🛒 <span id="cart-counter">0</span> Ürün
        </button>
    </nav>

    <section class="hero">
        <h1>PREMIUM MARKET</h1>
        <p>SEPETLİ VE SÜRATLİ HİZMET</p>
    </section>

    <div class="container">
        <div class="grid-header">
            <h2>GÜNCEL MENÜ</h2>
        </div>
        
        <div class="market-grid" id="market-grid">
            </div>
    </div>

    <div class="sidebar-cart" id="cart-sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 class="cart-title">Sepetiniz</h2>
            <span onclick="toggleCart()" style="cursor:pointer; font-size:2rem; margin-top:-30px;">×</span>
        </div>
        
        <div class="cart-items-list" id="cart-render">
            </div>

        <div class="cart-total-box">
            <div style="display:flex; justify-content:space-between; font-size:1.8rem; font-weight:900;">
                <span>Toplam:</span>
                <span id="grand-total">₺0.00</span>
            </div>
            <button class="checkout-btn" onclick="openModal()">SİPARİŞİ TAMAMLA</button>
        </div>
    </div>

    <div class="order-modal" id="order-modal">
        <div class="modal-content">
            <h2 style="margin-bottom:25px;">Sipariş Bilgileri</h2>
            <form action="https://formspree.io/f/mkovwdyw" method="POST">
                <input type="hidden" name="Siparis_Icerigi" id="hidden-cart-data">
                <input type="hidden" name="Toplam_Tutar" id="hidden-total">
                
                <input type="text" name="Ad_Soyad" placeholder="Ad Soyad" class="form-control" required>
                <input type="tel" name="Telefon" placeholder="Telefon Numarası" class="form-control" required>
                <textarea name="Adres" placeholder="Teslimat Adresi" class="form-control" style="height:100px" required></textarea>
                
                <button type="submit" class="checkout-btn">ONAYLA VE GÖNDER</button>
                <center><p onclick="closeModal()" style="margin-top:15px; cursor:pointer; opacity:0.5;">Vazgeç</p></center>
            </form>
        </div>
    </div>

    <section class="map-section">
        <div class="grid-header" style="border-color: #2ecc71;">
            <h2>KONUMUMUZ</h2>
        </div>
        <div class="map-wrapper">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3014.288219502941!2d29.2132!3d40.9102!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDDCsDU0JzM2LjciTiAyOcKwMTInNDcuNSJF!5e0!3m2!1str!2str!4v1715800000000!5m2!1str!2str" 
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
            </iframe>
        </div>
    </section>

    <footer>VOIDMARKET GLOBAL ENGINE - 2026</footer>

    <script>
        // Fotoğraf Sorunu Olmayan Hızlı Linkler (Unsplash Food)
        const items = [
            { id: 1, name: "Et Döner Dürüm", price: 140, desc: "Özel soslu yaprak et döner.", img: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=500" },
            { id: 2, name: "Ballı Pankek", price: 95, desc: "Organik bal ve taze meyveli.", img: "https://images.unsplash.com/photo-1567620905732-2d1ec7bb7445?w=500" },
            { id: 3, name: "Gurme Burger", price: 180, desc: "180gr köfte ve özel peynir.", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { id: 4, name: "Tavuklu Pizza", price: 160, desc: "Bol malzemeli ince hamur.", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" },
            { id: 5, name: "İskender Döner", price: 210, desc: "Tereyağlı, pideli efsane.", img: "https://images.unsplash.com/photo-1633321088355-d0f81134ca3b?w=500" },
            { id: 6, name: "Çıtır Kanat", price: 130, desc: "10 parça acılı/normal seçim.", img: "https://images.unsplash.com/photo-1567620832903-9fc6debc209f?w=500" },
            { id: 7, name: "Karışık Izgara", price: 320, desc: "Kuzu, tavuk ve köfte şöleni.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500" },
            { id: 8, name: "Sezar Salata", price: 110, desc: "Izgara tavuk ve parmesanlı.", img: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=500" },
            { id: 9, name: "Meksika Takosu", price: 150, desc: "Acı soslu dana etli 3'lü.", img: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=500" },
            { id: 10, name: "San Sebastian", price: 90, desc: "Akışkan çikolatalı cheesecake.", img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=500" },
            { id: 11, name: "Double Antrikot", price: 450, desc: "Kömür ateşinde dinlenmiş.", img: "https://images.unsplash.com/photo-1546241072-48010ad28c2c?w=500" },
            { id: 12, name: "Fettuccine", price: 140, desc: "Kremalı ve mantarlı makarna.", img: "https://images.unsplash.com/photo-1473093226795-af9932fe5856?w=500" },
            { id: 13, name: "Sıcak Brownie", price: 85, desc: "Vanilyalı dondurma eşliğinde.", img: "https://images.unsplash.com/photo-1564921922310-fe5583745e56?w=500" },
            { id: 14, name: "Buzlu Karamel", price: 75, desc: "Premium soğuk kahve.", img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=500" },
            { id: 15, name: "Tavuklu Noodle", price: 125, desc: "Uzakdoğu soslu sebzeli.", img: "https://images.unsplash.com/photo-1552611052-d59a0d9741bc?w=500" },
            { id: 16, name: "Ev Yapımı Mantı", price: 135, desc: "Bol yoğurtlu ve naneli.", img: "https://images.unsplash.com/photo-1616031036658-00624898144b?w=500" }
        ];

        let cart = [];

        function renderGrid() {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = items.map(p => `
                <div class="item-card">
                    <img src="${p.img}" class="item-img" alt="${p.name}">
                    <div class="item-body">
                        <h3 class="item-title">${p.name}</h3>
                        <p class="item-desc">${p.desc}</p>
                        <div class="item-footer">
                            <span class="item-price">₺${p.price}</span>
                            <button class="add-to-cart" onclick="addToCart(${p.id})">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = items.find(x => x.id === id);
            const inCart = cart.find(x => x.id === id);
            if(inCart) inCart.qty++;
            else cart.push({...product, qty: 1});
            updateUI();
        }

        function changeQty(id, delta) {
            const product = cart.find(x => x.id === id);
            product.qty += delta;
            if(product.qty < 1) cart = cart.filter(x => x.id !== id);
            updateUI();
        }

        function updateUI() {
            const render = document.getElementById('cart-render');
            let total = 0;
            let cartText = "";

            render.innerHTML = cart.map(p => {
                total += p.price * p.qty;
                cartText += `${p.name} (x${p.qty}), `;
                return `
                    <div class="cart-row">
                        <div style="font-weight:600;">${p.name}</div>
                        <div class="qty-box">
                            <span class="qty-btn" onclick="changeQty(${p.id}, -1)">-</span>
                            <span>${p.qty}</span>
                            <span class="qty-btn" onclick="changeQty(${p.id}, 1)">+</span>
                        </div>
                        <div style="color:var(--primary-color); font-weight:800;">₺${p.price * p.qty}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('grand-total').innerText = "₺" + total;
            document.getElementById('cart-counter').innerText = cart.reduce((a,b) => a + b.qty, 0);
            document.getElementById('hidden-cart-data').value = cartText;
            document.getElementById('hidden-total').value = "₺" + total;
        }

        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); }
        function openModal() { if(cart.length > 0) document.getElementById('order-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('order-modal').style.display = 'none'; }

        renderGrid();
    </script>
</body>
</html>
